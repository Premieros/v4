name: Sanitize Supabase references

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/products-permission-branch-rules-20260904'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/products-permission-branch-rules-20260904
          fetch-depth: 0

      - name: Replace foreign Supabase URLs
        shell: python
        run: |
          import pathlib
          import re

          root = pathlib.Path('.')
          expected = 'https://cuitndfayupfysejlpda.supabase.co'
          pattern = re.compile(r'https://[a-z0-9-]+\.supabase\.co', re.I)
          skip = {'.git', 'node_modules', 'dist', 'coverage', 'playwright-report'}
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              try:
                  raw = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = pattern.sub(lambda m: expected if m.group(0).rstrip('/') != expected else m.group(0), raw)
              if updated != raw:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(f'- {item}')

      - name: Commit sanitized references
        run: |
          if git diff --quiet; then
            echo "No foreign Supabase references remain."
            exit 0
          fi
          git config user.name "Premieros"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove foreign Supabase references"
          git push origin HEAD:fix/products-permission-branch-rules-20260904
